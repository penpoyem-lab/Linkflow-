name: Android Release — Build & Publish OTA APK to GitHub Releases

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version tag (e.g. v2.5.0)'
        required: true
        default: 'v2.5.0'
      release_title:
        description: 'Release title shown in Software Update dialog'
        required: true
        default: 'Version 2.5.0 is ready to install'

permissions:
  contents: write

jobs:
  publish-release-apk:
    name: Validate, Build Signed APK & Publish GitHub Release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      - name: Prepare Signing Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          fi
          if [ -s debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -s debug.keystore ]; then
            rm -f debug.keystore
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest

      - name: Build Compatible Update APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -s my-upload-key.jks ] && [ -n "$STORE_PASSWORD" ]; then
            gradle :app:assembleRelease
            cp app/build/outputs/apk/release/*.apk linkflow-release.apk
          else
            gradle :app:assembleDebug
            cp app/build/outputs/apk/debug/*.apk linkflow-release.apk
          fi
          sha256sum linkflow-release.apk | awk '{print $1}' > linkflow-release.apk.sha256

      - name: Publish GitHub Release with APK & SHA-256 Digest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
          REL_TITLE: ${{ inputs.release_title || format('Version {0} is ready to install', github.ref_name) }}
        run: |
          SHA256_VAL=$(cat linkflow-release.apk.sha256)
          cat <<EOF > release_notes.md
          We've supercharged LinkFlow with enhanced liquid-glass animations, universal social media share resolution, and faster multi-threaded downloads.

          ### Top Features
          - Direct Android Share Target for Instagram Reels, TikTok, YouTube Shorts, X, and Reddit
          - Google Play Store-style transparent scalloped pull-to-refresh physics
          - Hardware-accelerated 120fps Liquid-Glass bottom navigation bar
          - Cryptographic SHA-256 ($SHA256_VAL) & package signature verification
          EOF

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" linkflow-release.apk --clobber
          else
            gh release create "$TAG_NAME" linkflow-release.apk \
              --title "$REL_TITLE" \
              --notes-file release_notes.md
          fi
